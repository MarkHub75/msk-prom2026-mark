services:
  safewatch:
    build: .
    ports:
      - "8000:8000"
    # A fresh machine without .env still starts: the seed and the demo pack need no keys.
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - argus_data:/app/data/app
      - ./data/demo:/app/data/demo:ro
      - ./models:/app/models:ro
      # Create this file from config/docker.example.yaml before the first start.
      # Fail if missing instead of silently creating a directory or using synthetic defaults.
      - type: bind
        source: ./config/user.yaml
        target: /app/config/user.yaml
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      # The slim image has no curl: python of the image asks the API itself.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  argus_data:
    # A new volume for UPGRADE v3; existing host data and older volumes stay untouched.
    name: ${ARGUS_DATA_VOLUME:-argus-upgrade-v3-stage1-data}
