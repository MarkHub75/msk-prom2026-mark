services:
  safewatch:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Jupyter of LinQ is reached through the SSH tunnel on the host (tech.md 3.1).
      LINQ_JUPYTER_URL: http://host.docker.internal:8888
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/app:/app/data/app
      - ./models:/app/models:ro
