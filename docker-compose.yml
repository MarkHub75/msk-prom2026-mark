services:
  safewatch:
    build: .
    image: argus:local
    ports:
      - "8000:8000"
    environment:
      # The fake LinQ backend needs neither credentials nor an accelerator.
      SAFEWATCH_FAKE: "1"
      INFERENCE_BACKEND: linq
    volumes:
      - ./data/app:/app/data/app
      - ./models:/app/models:ro
      - ./data/demo:/app/data/demo:ro
