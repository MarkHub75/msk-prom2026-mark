      const draw = window.ArgusHud2.create(document.getElementById("h2-hud"), "d-loco", { stroke: 2, font: 15 });

      tl.fromTo("#h2-stage", at(1020, 520, 1.2), { ...at(1080, 470, 1.42), duration: DUR, ease: "power1.inOut" }, 0);

      tl.fromTo(c, { v: 0 }, { v: 1.17, duration: 0.5, ease: "power3.out", onUpdate: () => { num.textContent = c.v.toFixed(2).replace(".", ","); } }, 0.06);

      tl.to("#h2-copy, #h2-src", { scale: 1.12, opacity: 0, filter: "blur(16px)", transformOrigin: "20% 50%", duration: 0.22, ease: "power3.in" }, 2.78);
      tl.to("#h2-stage", { opacity: 0.2, duration: 0.2, ease: "power2.in" }, 2.8);
      window.__timelines["v2-hook"] = tl;
    })();
