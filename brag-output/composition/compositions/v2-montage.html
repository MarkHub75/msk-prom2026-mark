        [H2.create(document.getElementById("mt-h5"), "d-loco", { stroke: 1.6, font: 12 }), 22, 2.68],
      ];
      const p = { t: 0 };
      const render = (t) => draws.forEach((d) => { if (d) d[0](d[1] + Math.max(0, t - d[2])); });
      tl.fromTo(p, { t: 0 }, { t: 3.1, duration: 3.1, ease: "none", onUpdate: () => render(p.t) }, 0);

      const at = (cx, cy, s) => ({ scale: s, x: 960 - cx * s, y: 540 - cy * s });
      // [start, end, framing from, framing to]; every shot arrives with a little push and a 2-frame flash on the cut
      const shots = [
        [0, 0.6, at(850, 700, 2.15), at(850, 690, 2.0)],
        [0.6, 1.12, at(1300, 360, 2.2), at(1300, 360, 2.0)],

        [2.68, 3.1, at(1150, 560, 1.55), at(1150, 560, 1.45)],
      ];
      shots.forEach(([s, e, a, b], i) => {
        tl.set(`#mt-s${i}`, { opacity: 1 }, s);
        if (i < shots.length - 1) tl.set(`#mt-s${i}`, { opacity: 0 }, e);
        tl.fromTo(`#mt-g${i}`, a, { ...b, duration: e - s, ease: "power2.out" }, s);

      });
      window.__timelines["v2-montage"] = tl;
