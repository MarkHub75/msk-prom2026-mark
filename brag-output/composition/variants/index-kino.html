<!doctype html>
<html lang="ru" data-composition-variables='[
  {"id":"color-ground","type":"color","label":"Фон","default":"#111214"},
  {"id":"color-ink","type":"color","label":"Текст","default":"#eceef1"},
  {"id":"color-red","type":"color","label":"Тревога","default":"#d64545"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>АРГУС — промо 30 с (кино)</title>
    <script src="assets/js/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Source Sans Pro"; font-weight: 600; src: url("assets/fonts/SourceSansPro-Semibold.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #111214; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0b; }
      /* 2.35:1 letterbox over the whole film; it opens on the «АРГУС» impact */
      .bar { position: absolute; left: 0; width: 1920px; height: 132px; z-index: 40; }
      .bar::before { content: ""; position: absolute; inset: 0; background: #050506; }
      #bar-top { top: 0; transform-origin: 50% 0; }
      #bar-bot { bottom: 0; transform-origin: 50% 100%; }
      .sub { position: absolute; left: 0; width: 1920px; top: 990px; z-index: 45; text-align: center; color: #d5d8dd;
        font: 600 34px/1.2 "Source Sans Pro", sans-serif; letter-spacing: .01em; white-space: nowrap; }
      .sub.left { left: 150px; width: auto; text-align: left; color: #a1a7b0; font-size: 30px; top: 994px; }
      #credit { position: absolute; right: 150px; top: 50px; z-index: 45; color: #8a909a; font: 600 24px/1.2 "Source Sans Pro", sans-serif; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <div id="hook-k" data-composition-id="hook-k" data-composition-src="compositions/hook-k.html" data-start="0" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="dash-k" data-composition-id="dash-k" data-composition-src="compositions/dash-k.html" data-start="5" data-duration="2.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="cam-k" data-composition-id="cam-k" data-composition-src="compositions/cam-k.html" data-start="7.2" data-duration="2.8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="alarm-k" data-composition-id="alarm-k" data-composition-src="compositions/alarm-k.html" data-start="10" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="phone-k" data-composition-id="phone-k" data-composition-src="compositions/phone-k.html" data-start="14" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="journal-k" data-composition-id="journal-k" data-composition-src="compositions/journal-k.html" data-start="17" data-duration="1.8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="linq" data-composition-id="linq" data-composition-src="compositions/linq.html" data-start="18.8" data-duration="1.8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="phrase" data-composition-id="phrase" data-composition-src="compositions/phrase.html" data-start="20.6" data-duration="3.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="finale" data-composition-id="finale" data-composition-src="compositions/finale.html" data-start="24" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <div id="bar-top" class="bar clip" data-start="0" data-duration="30" data-track-index="2" data-track-kind="graphics" data-layout-ignore></div>
      <div id="bar-bot" class="bar clip" data-start="0" data-duration="30" data-track-index="3" data-track-kind="graphics" data-layout-ignore></div>
      <div id="credit" class="clip" data-start="0.5" data-duration="16.5" data-track-index="4" data-track-kind="graphics" data-layout-ignore>Видео: Onal, Dandil, Mendeley Data, CC BY 4.0</div>
      <div id="sub-src" class="sub left clip" data-start="1" data-duration="3.6" data-track-index="5" data-track-kind="graphics">Росстат, 2025</div>
      <div id="sub-1" class="sub clip" data-start="5.3" data-duration="1.8" data-track-index="6" data-track-kind="graphics">Диспетчерская оператора · Камера 1.3</div>
      <div id="sub-2" class="sub clip" data-start="9.4" data-duration="2.3" data-track-index="7" data-track-kind="graphics">Красная тревога: опасное сближение с техникой</div>
      <div id="sub-3" class="sub clip" data-start="11.9" data-duration="2" data-track-index="6" data-track-kind="graphics">Оператор подтверждает — событие у мастера</div>
      <div id="sub-4" class="sub clip" data-start="14.2" data-duration="2.7" data-track-index="7" data-track-kind="graphics">Мастер на телефоне: «Принял, иду» → «Решено»</div>
      <div id="sub-5" class="sub clip" data-start="17.1" data-duration="1.6" data-track-index="6" data-track-kind="graphics">Запись в журнале охраны труда</div>

      <!-- Music: Sascha Ende, ende.app (CC BY 4.0). Same edit as the dynamic cut: strong beat 13.11 → 9.29 (red). -->
      <audio id="music" data-start="0" data-duration="30" data-media-start="3.82" data-track-index="10" data-volume="1"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":1.2,"v":0.34},{"t":23.9,"v":0.34},{"t":24.6,"v":0.18},{"t":27.8,"v":0}]}]}'
        src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3"></audio>
      <audio id="sfx-red" data-start="9.27" data-duration="1.5" data-track-index="12" data-volume="0.9" src="assets/sfx/alarm-hit.wav"></audio>
      <audio id="sfx-take" data-start="10" data-duration="0.18" data-track-index="13" data-volume="0.4" src="assets/sfx/impactSoft_medium_001.ogg"></audio>
      <audio id="sfx-confirm" data-start="12.65" data-duration="0.01" data-track-index="14" data-volume="0.8" src="assets/sfx/click_003.ogg"></audio>
      <audio id="sfx-tap1" data-start="14.9" data-duration="0.06" data-track-index="15" data-volume="0.7" src="assets/sfx/click2.ogg"></audio>
      <audio id="sfx-tap2" data-start="16.06" data-duration="0.06" data-track-index="16" data-volume="0.7" src="assets/sfx/click2.ogg"></audio>
      <audio id="sfx-journal" data-start="17" data-duration="0.19" data-track-index="17" data-volume="0.35" src="assets/sfx/drop_002.ogg"></audio>
      <audio id="sfx-argus" data-start="24.5" data-duration="4.6" data-track-index="18" data-volume="1" src="assets/sfx/argus-hit.wav"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#credit", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.5);
      [["#sub-src", 1, 3.6], ["#sub-1", 5.3, 1.8], ["#sub-2", 9.4, 2.3], ["#sub-3", 11.9, 2], ["#sub-4", 14.2, 2.7], ["#sub-5", 17.1, 1.6]].forEach(([id, s, d]) => {
        tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, s);
        tl.to(id, { opacity: 0, duration: 0.2, ease: "power2.in" }, s + d - 0.22);
      });
      // the bars open on the «АРГУС» impact (24 + 0.56)
      tl.to("#bar-top, #bar-bot", { scaleY: 0, duration: 0.32, ease: "expo.out" }, 24.56);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
