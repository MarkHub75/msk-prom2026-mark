name: gate

# Sessions merge right after a green local gate and do not wait for CI. Whoever started the
# session checks it with `gh pr checks <PR>`, which works after the merge too.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run poe gate
