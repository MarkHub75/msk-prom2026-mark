[project]
name = "safewatch"
version = "0.1.0"
description = "SafeWatch: video safety monitoring on LinQ TPU"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "websockets",
    "python-multipart",
    "pydantic>=2",
    "pydantic-settings",
    "pyyaml",
    "numpy",
    "scipy",
    "opencv-python-headless",
    "onnxruntime",
    "requests",
    "websocket-client",
    "python-dotenv",
    "httpx",
    "psutil",
    "tzdata",
]

[project.scripts]
safewatch = "safewatch.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "hypothesis",
    "respx",
    "ruff",
    "mypy",
    "poethepoet",
    "types-pyyaml",
    "types-requests",
    "types-psutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safewatch"]

[tool.poe.tasks]
format = "ruff format src tests scripts"
lint = { sequence = ["ruff format --check src tests scripts", "ruff check src tests scripts"], default_item_type = "cmd" }
check = "mypy --strict src"
test = "pytest -m 'not live'"
contract = "python scripts/contract_check.py"
api = "safewatch contract --check"
eol = "python scripts/eol_check.py"
frontend = { shell = "npm --prefix frontend run gate" }
gate = ["lint", "check", "test", "contract", "api", "eol", "frontend"]
live = "pytest -m live"

[tool.ruff]
line-length = 100
target-version = "py312"
# ruff formats code blocks inside Markdown: tech.md and docs/ are owner-edited, keep them out.
extend-exclude = ["*.md"]

[tool.ruff.format]
# CRLF files slipped into main twice on Windows; `ruff format --check` now flags them.
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "onnxruntime", "scipy.*", "jupyter_remote", "yolo_io"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
# A test waiting for a state fails instead of hanging the gate (tech.md 10, rule 6).
timeout = 60
markers = ["live: real network and real keys, run with `uv run poe live`"]
