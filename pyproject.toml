[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mosprom-ml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "Pillow>=10"]

[project.optional-dependencies]
prepare = ["ultralytics==8.4.184", "onnx", "onnxruntime"]
video = ["opencv-python-headless"]

[project.scripts]
mosprom-ml = "ml.pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["ml*"]

[tool.setuptools.package-data]
"ml.contracts" = ["schemas/*.json"]
