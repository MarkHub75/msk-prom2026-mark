<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Image-slide QA capture</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#111214;overflow:hidden}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#slide{display:block;width:100vw;height:100vh;object-fit:contain}
</style>
<main id="stage"><img id="slide" alt="Готовый растровый слайд"></main>
<script>
// Measurement harness only: not a presentation site or speaker application.
const n=Number(new URL(location.href).searchParams.get('slide'));
if(!Number.isInteger(n)||n<1||n>15)throw new Error('Expected slide=1…15');
const im=document.querySelector('#slide');
im.src='../slides/slide-'+String(n).padStart(2,'0')+'.png';
im.decode().then(()=>{document.querySelector('#stage').dataset.craftSettled='true';});
</script>
</html>
