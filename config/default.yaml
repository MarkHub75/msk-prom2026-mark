# Defaults (tech.md 6.6). config/user.yaml overrides any key; tests never read it.
product_name: Argus
data_dir: data/app
timezone: Europe/Moscow

server:
  host: 127.0.0.1
  port: 8000
  static_dir: frontend/dist

upload:
  max_mb: 2048
  extensions: [".mp4", ".avi", ".mov", ".mkv"]

pipeline:
  target_analysis_fps: 12
  min_analysis_fps: 5
  detector: det-yolov8n@640-ap9999
  pose: pose-yolov8n@640-ap9999
  extra: []
  vehicle_classes: [car, bus, truck, train]

class_conf:
  car: 0.35
  bus: 0.35
  truck: 0.35
  train: 0.35
  cell phone: 0.3
  fire: 0.35
  smoke: 0.3
  cigarette: 0.25
  no_harness: 0.35
  suspended_load: 0.35
  helmet: 0.35
  no_helmet: 0.35
  respirator: 0.35
  no_respirator: 0.35

tracker:
  high_thresh: 0.5
  low_thresh: 0.1
  new_track_thresh: 0.6
  min_iou: 0.2
  max_lost_s: 1.0
  min_hits: 2
  reattach_bh: 1.0

pose:
  match_iou: 0.5
  kpt_conf: 0.3

features:
  ref_window_s: 2.0
  upright_hw: 1.2
  lying_wh: 1.3
  upright_torso_deg: 30
  lying_torso_deg: 60
  speed_window_s: 1.0
  speed_min_samples: 4
  speed_max_gap_s: 0.5
  still_motion_bh: 0.15
  still_after_s: 3.0
  min_person_px: 40

episodes:
  candidate_gap_s: 0.5
  end_after_s: 2.0
  lost_timeout_s: 5.0
  merge_dist_bh: 1.0

scenarios:
  running:
    speed_bh_s: 1.5
    speed_m_s: 2.5
    hold_s: 1.0
    red_hold_s: 0.5
    near_vehicle_bh: 3.0
    near_vehicle_m: 3.0
  proximity:
    yellow_bh: 2.0
    red_bh: 0.5
    yellow_m: 3.0
    red_m: 1.0
    moving_vh_s: 0.2
    moving_m_s: 0.5
    hold_s: 0.5
    red_hold_s: 0.3
    driver_ioa: 0.6
  phone:
    hold_s: 10.0
    danger_hold_s: 3.0
    min_person_px: 120
    upper_frac: 0.6
    wrist_dist_bh: 0.25
  fall:
    transition_s: 2.0
    confirm_s: 2.0
    still_s: 10.0
    allowed_still_s: 60.0
  fence_crossing:
    max_gap_s: 1.0
  restricted_under:
    under_hold_s: 0.5
  fire_smoking:
    fire_hold_s: 1.0
    smoking_hold_s: 3.0
  no_harness:
    harness_hold_s: 3.0
  suspended_load:
    load_hold_s: 0.5
  load_carrying: {}
  no_helmet:
    hold_s: 3.0
    head_frac: 0.35
    min_person_px: 80
  no_respirator:
    hold_s: 3.0
    head_frac: 0.35
    min_person_px: 80

zone_kinds:
  - id: danger
    title: Опасная зона / механизм
    color: "#FF453A"
    geometry: polygon
    description: Станок, пресс, конвейер, зона работы техники. Вход человека — красное событие.
  - id: fence
    title: Ограждение
    color: "#FF9F0A"
    geometry: line
    description: Линия, которую нельзя пересекать.
  - id: under_load
    title: Под конвейером / грузом
    color: "#BF5AF2"
    geometry: polygon
    description: Проход под конвейером или зона подъёма груза.
  - id: fire_allowed
    title: Огонь разрешён
    color: "#FF6B00"
    geometry: polygon
    description: Печь, сварочный пост. Огонь здесь не нарушение.
  - id: lying_allowed
    title: Лежать допустимо
    color: "#30D158"
    geometry: polygon
    description: Ремонт под станком или вагоном. Тревога только при долгой неподвижности.
  - id: rest
    title: Зона отдыха
    color: "#64D2FF"
    geometry: polygon
    description: Места отдыха. Телефон здесь разрешён.
  - id: height
    title: Работа на высоте
    color: "#FFD60A"
    geometry: polygon
    description: Площадки и лестницы, где нужна страховочная привязь.
  - id: vehicle_path
    title: Пути транспорта
    color: "#98989D"
    geometry: polygon
    description: Проезды погрузчиков и машин.
  - id: helmet_required
    title: Обязательна каска
    color: "#FF9500"
    geometry: polygon
    description: Цех или участок, где без каски нельзя. Человек без каски дольше порога — жёлтое событие.
  - id: respirator_required
    title: Обязателен респиратор
    color: "#5E5CE6"
    geometry: polygon
    description: Участок с пылью или парами. Человек без респиратора дольше порога — жёлтое событие.
  - id: walkway
    title: Проход («зелёная линия»)
    color: "#34C759"
    geometry: polygon
    description: Безопасный проход. Телефон здесь разрешён.

escalation:
  enabled: true
  timeout_s: 45
  tick_ms: 500

broadcast:
  tick_ms: 250
  loop_default: false
  autostart: true

feed:
  limit: 100
  recent_closed_min: 30

observability:
  stale_after_ms: 2000
  sample_s: 1.0
  dark_mean: 35
  obstructed_std: 12
  min_duration_s: 3.0

evidence:
  jpeg_quality: 85
  max_width: 1280

preview:
  cache_s: 2.0
  max_width: 640

hud:
  window_max_ms: 10000

jobs:
  max_attempts: 3
  retry_backoff_s: [30, 120]
  idle_poll_ms: 500
  list_max: 200

linq:
  tools_dir: tools/linq
  remote_dir: baseline
  file_prefix: baseline_
  programs_dir: /auto/cache/{login}
  inflight: 4
  poll_interval_s: 3.0
  job_timeout_s: 1800
  call_timeout_s: 60
  check_cache_s: 30
  reply_timeout_s: 120
  slow_rtt_s: 12.0

local:
  threads: 2
  providers: [CPUExecutionProvider]   # S29; CUDAExecutionProvider — для GPU-машины ML-части

shifts:
  - id: day
    title: Дневная смена
    start: "08:00"
    end: "20:00"
  - id: night
    title: Ночная смена
    start: "20:00"
    end: "08:00"

stats:
  default_days: 30
  weeks_default: 8
  trend_weeks: 4

journal:
  page_max: 200
  export_max_rows: 10000

master:
  recent_resolved: 20

delivery:
  webhooks: []   # [{name: lamp-1, url: "http://10.0.0.5/alarm", levels: [red], timeout_s: 3}]
  calls:                           # S23: только kind=to_master
    - {name: master, to: "", levels: [red], provider: stub}

eval:
  deadline_s: 5.0

autocal:
  person_height_m: 1.7
  min_samples: 30
  min_person_px: 40
  edge_px: 2
  max_residual: 0.15               # доля роста: точка дальше 15 % от линии отбрасывается
  iterations: 3

clips:
  pre_s: 3.0
  post_s: 5.0
  max_s: 30.0

transcode:
  enabled: true
  crf: 23
  preset: veryfast
  timeout_s: 600

demo:
  pack: data/demo/argus
  autoload: true

datasets:
  tick_ms: 2000
  max_frames: 40

passport:
  min_frames: 50
  person_partial_px: 80
  small_object_px: 12
  dark_partial: 0.2
  dark_unsuitable: 0.5
  empty_partial: 0.8

shift:                             # S32
  max_px: 20
  sample_width: 320

calculator:
  assumptions:
    - key: accelerator.capacity_fps
      title: "Пропускная способность одного ускорителя LinQ"
      value: 12.4
      unit: "кадр/с"
      source: "замер LinQ 24.10 14:52: детектор 640, inflight 4, общая очередь площадки"
    - key: models_per_frame
      title: "Запросов к TPU на кадр"
      value: 2
      unit: "шт."
      source: "конвейер Argus: детектор и pose"
    - key: accelerators_per_server
      title: "Ускорителей в одном сервере"
      value: 4
      unit: "шт."
      source: "допущение команды, уточнить у ХайТэк"
    - key: accelerator.price_rub
      title: "Цена ускорителя LinQ"
      value: 500000
      unit: "₽"
      source: "допущение команды: цена не опубликована, заменить ценой поставщика"
    - key: server.price_rub
      title: "Цена сервера под ускорители"
      value: 350000
      unit: "₽"
      source: "допущение команды, уточнить у поставщика"
    - key: integration_rub
      title: "Пусконаладка и подключение камер"
      value: 300000
      unit: "₽"
      source: "допущение команды"
    - key: support_share_year
      title: "Поддержка в год, доля от вложений"
      value: 0.15
      unit: "доля"
      source: "допущение команды"
    - key: light_sound_rub
      title: "Световой и звуковой сигнал у зоны"
      value: 25000
      unit: "₽ за зону"
      source: "допущение команды, уточнить у поставщика"
    - key: zones_per_camera
      title: "Сигнальных зон на камеру"
      value: 1
      unit: "шт."
      source: "допущение команды"
    - key: speaker_rub
      title: "Громкоговоритель в цех"
      value: 40000
      unit: "₽ за цех"
      source: "допущение команды, уточнить у поставщика"
    - key: new_camera_rub
      title: "Новая IP-камера с монтажом"
      value: 30000
      unit: "₽"
      source: "допущение команды, уточнить у поставщика"
    - key: new_cameras_share
      title: "Доля новых камер на максимальном уровне"
      value: 0.2
      unit: "доля"
      source: "допущение команды"
    - key: reduction.base
      title: "Снижение инцидентов: базовый уровень"
      value: 0.2
      unit: "доля"
      source: "гипотеза команды, проверяется пилотом; доказанного эффекта нет"
    - key: reduction.extended
      title: "Снижение инцидентов: расширенный уровень"
      value: 0.3
      unit: "доля"
      source: "гипотеза команды, проверяется пилотом; доказанного эффекта нет"
    - key: reduction.max
      title: "Снижение инцидентов: максимальный уровень"
      value: 0.4
      unit: "доля"
      source: "гипотеза команды, проверяется пилотом; доказанного эффекта нет"

# Calculator v2 (docs/contracts/calculator_v2.md К9, К11): request defaults, catalog, sources.
# Numbers here are signed assumptions or vendor claims; the owner refines them in config/user.yaml.
calculator_v2:
  site: {workshops: 2, workers: 200, shifts_per_day: 2, working_days_year: 250, operators: 2}
  load:
    activity_share: 0.5
    activity_measurement_id: null
    target_fps: 12
    surge_fps: 5
    idle_check_s: 4
    peak_mode: independent_p95
    priority_cameras_reserve: 1
    detector_stride: 1
    reference_chip_fps: 104.8
    capacity_derate: 0.5
    platform_capacity_override_fps: null
    model_cost_overrides: {}
    cpu_basis: inclusive
    cpu_ms_per_unit: 77
    decode_cores_per_camera: 0
  hardware:
    allowed_board_ids: [HP, HPD, HPQ]
    board_price_overrides: {}
    server: {slots: 4, usable_cpu_cores: 16, price_rub: 350000, power_w: 250}
  costs:
    integration_fixed_rub: 300000
    integration_per_camera_rub: 0
    support_share_year: 0.15
    electricity_rub_kwh: 8
    operating_hours_year: 8760
    signal_zones_per_camera: 1
    signal_unit_rub: 25000
    speaker_per_workshop_rub: 40000
    new_camera_unit_rub: 30000
    new_camera_count: 0
    max_additional_camera_share: 0.2
  benefits:
    injuries:
      enabled: true
      annual_injured_workers: null
      rate_per_1000: 1.17
      cost_per_injured_worker_rub: 1000000
      cost_scope: direct_only
      reduction: {base: 0.2, extended: 0.3, max: 0.4}
    downtime:
      enabled: false
      events_year: null
      days_per_event: null
      day_cost_rub: null
      reduction: {base: 0.2, extended: 0.3, max: 0.4}
    fines:
      enabled: false
      items:
        - id: general_ohs
          title: "Общие требования охраны труда"
          inspection_probability_year: 0.1
          amount_rub: 65000
          reduction: {base: 0.2, extended: 0.3, max: 0.4}
        - id: ppe
          title: "Обеспечение СИЗ"
          inspection_probability_year: 0.1
          amount_rub: 140000
          reduction: {base: 0.2, extended: 0.3, max: 0.4}
    sfr_discount: {enabled: false, payroll_rub_year: null, tariff_share: null, additional_discount_share: null}
    labor:
      monetize: false
      rows:
        - {id: ohs, title: "Инженер охраны труда", hours_saved_year: 0, hour_cost_rub: null}
        - {id: operator, title: "Оператор", hours_saved_year: 0, hour_cost_rub: null}
    severe_injury_cost_rub: null
  group_models: [det-yolov8n@640-ap9999, pose-yolov8n@640-ap9999]
  rollout_cameras: 8
  scale_current_cameras: 8
  scale_added_cameras: 8
  scale_new_camera_count: 8  # assumption: the added area buys its physical cameras
  presets:
    - id: workshop
      title: "Мастерская"
      area_m2: 100
      machines: 5
      note: "Работники, смены, плотность и смесь моделей — редактируемые допущения."
      site: {workshops: 1, workers: 50, shifts_per_day: 1, working_days_year: 250, operators: 1}
      cameras: 5
    - id: shop
      title: "Цех"
      area_m2: 10000
      machines: null
      note: "Работники, смены, плотность и смесь моделей — редактируемые допущения."
      site: {workshops: 1, workers: 200, shifts_per_day: 2, working_days_year: 250, operators: 2}
      cameras: 20  # assumption: 2 cameras per 1000 m²
    - id: plant
      title: "Завод"
      area_m2: null
      machines: null
      note: "Работники, смены, плотность и смесь моделей — редактируемые допущения."
      site: {workshops: 4, workers: 2000, shifts_per_day: 3, working_days_year: 250, operators: 4}
      cameras: 200
  platform_capacity_fps: 12.4
  pose_scenarios: [fall, phone, fire_smoking]  # rules reading keypoints (wrists, posture)
  models:
    det-yolov8n@640-ap9999:
      title: "Детектор YOLOv8n"
      work_units: 1
      execution_status: verified_linq
      source_ids: [team_defaults, linq_historical_report]
    pose-yolov8n@640-ap9999:
      title: "Поза YOLOv8n-pose"
      work_units: 1
      execution_status: verified_linq
      source_ids: [vendor_pose_benchmark, linq_historical_report]
  boards:
    - {id: HP, title: "LinQ HP", chips: 1, slots: 1, power_w: 35, price_rub: 500000, source_ids: [vendor_modules, vendor_board_power_hp, team_defaults]}
    - {id: HPD, title: "LinQ HPD", chips: 2, slots: 1, power_w: 100, price_rub: null, source_ids: [vendor_modules, vendor_board_power_hpd, team_defaults]}
    - {id: HPQ, title: "LinQ HPQ", chips: 4, slots: 1, power_w: 150, price_rub: null, source_ids: [vendor_modules, vendor_board_power_hpq, team_defaults]}
  inputs:
